- runway: "12R"
- assign_dep_rwy: "true"

# CFL
- CFL: "200"
- if:
    VFR: "true"
  CFL: "009"

# =========================================
# RWY 12R - ANTEK (conv only, no RNAV)
# =========================================
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UJ18", "UB764"]
  SID: "ANTE2A"

# =========================================
# RWY 12R - RNAV (all color groups)
# Red: UR506/UV106/UB764 -> NUDAL
# =========================================
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UR506", "UV106"]
  SID: "NUDA1A"

# Blue: UJ52/UG765 -> HECAT
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UJ52", "UG765"]
  SID: "HECA2A"

# Purple: UM782 -> TAKUX
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UM782"]
  SID: "TAKU2A"

# Gray: UB881/UT51/UT32/UT57/CZM -> ALSUP
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UB881", "UT51", "UT32", "UT57"]
  SID: "ALSU1C"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["CZM"]
  SID: "ALSU1C"

# Orange: UJ84/UT78/V56/UA766 -> UDGUV
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UJ84", "UT78", "V56", "UA766"]
  SID: "UDGU2A"

# Plain: UT27 -> NOSUG
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UT27"]
  SID: "NOSU2A"

# DarkRed: UM219 -> ROTGI
- if:
    runway: ["12R", "12L", "12"]
    airway: ["UM219"]
  SID: "ROTG2A"

# =========================================
# RWY 30L - ANTEK (conv only)
# =========================================
- if:
    runway: ["30L", "30R", "30"]
    airway: ["UJ18", "UB764"]
  SID: "ANTE2C"

# =========================================
# RWY 30L - Conventional (no RNAV for HECAT/TAKUX on 30)
# =========================================
- if:
    runway: ["30L", "30R", "30"]
    airway: ["UJ52", "UG765"]
  SID: "DUMB1C"

- if:
    runway: ["30L", "30R", "30"]
    airway: ["UM782"]
  SID: "BOTO2C"

# =========================================
# RWY 30L - RNAV (where 30L exists)
# =========================================
- if:
    runway: ["30L", "30R", "30"]
    airway: ["UR506", "UV106"]
  SID: "NUDA1F"

- if:
    runway: ["30L", "30R", "30"]
    airway: ["UB881", "UT51", "UT32", "UT57"]
  SID: "ALSU1F"
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["CZM"]
  SID: "ALSU1F"

- if:
    runway: ["30L", "30R", "30"]
    airway: ["UJ84", "UT78", "V56", "UA766"]
  SID: "UDGU1F"

- if:
    runway: ["30L", "30R", "30"]
    airway: ["UT27"]
  SID: "NOSU2F"

- if:
    runway: ["30L", "30R", "30"]
    airway: ["UM219"]
  SID: "ROTG2F"

# Green: UL577/UM782 -> AVSEB (30L only, overrides BOTOP)
- if:
    runway: ["30L", "30R", "30"]
    airway: ["UL577"]
  SID: "AVSE1F"

# =========================================
# WAYPOINT FALLBACKS (conv fix -> RNAV SID)
# Catches SimBrief routes with waypoint names
# =========================================

# 12R waypoint conversions
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["DUMBU"]
  SID: "HECA2A"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["BOTOP"]
  SID: "TAKU2A"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["LIDEK"]
  SID: "ALSU1C"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["VOBED"]
  SID: "UDGU2A"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["ENEBA"]
  SID: "NOSU2A"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["OMSUK"]
  SID: "ROTG2A"
- if:
    runway: ["12R", "12L", "12"]
    waypoint: ["DUGNI"]
  SID: "NUDA1A"

# 30L waypoint conversions
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["LIDEK"]
  SID: "ALSU1F"
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["VOBED"]
  SID: "UDGU1F"
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["ENEBA"]
  SID: "NOSU2F"
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["OMSUK"]
  SID: "ROTG2F"
- if:
    runway: ["30L", "30R", "30"]
    waypoint: ["DUGNI"]
  SID: "NUDA1F"

# RNAV fix waypoints (direct match)
- if:
    waypoint: ["NUDAL"]
  SID: "NUDA1A"
- if:
    waypoint: ["HECAT"]
  SID: "HECA2A"
- if:
    waypoint: ["TAKUX"]
  SID: "TAKU2A"
- if:
    waypoint: ["ALSUP"]
  SID: "ALSU1C"
- if:
    waypoint: ["UDGUV"]
  SID: "UDGU2A"
- if:
    waypoint: ["NOSUG"]
  SID: "NOSU2A"
- if:
    waypoint: ["ROTGI"]
  SID: "ROTG2A"
- if:
    waypoint: ["AVSEB"]
  SID: "AVSE1F"

# Departure Frequencies
- departures: ["121.0", "118.6", "118.1", "124.2", "124.7", "128.3"]
